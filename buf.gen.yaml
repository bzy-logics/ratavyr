# Used by scripts/generate.sh; the input (.contract/) is materialised from the
# pinned tag in contract.lock. Plugins run via `go tool` (pinned in go.mod).
version: v2
inputs:
  - directory: .contract
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen
    opt: paths=source_relative
